name: GUI Agents Daily Paper

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *" # 09:00 Hong Kong time

permissions:
  contents: read

concurrency:
  group: gui-daily-paper
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: deepseek-v4-flash
      SUMMARY_MODEL: deepseek-v4-flash
      DPR_MODELS_REMOTE_ONLY: '1'
      DPR_EMBED_ALLOW_LOCAL_FALLBACK: '0'
      RERANK_PROFILE: public-zwwen-rerank
      DPR_RERANK_GLOBAL_POOL_LIMIT: '16'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate one paper
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::error::Set the DEEPSEEK_API_KEY Actions secret."
            exit 1
          fi
          today=$(date -u +%Y%m%d)
          if [ ! -f "docs/${today:0:6}/${today:6:2}/_daily_state.json" ]; then
            python scripts/run_gui_daily.py
          fi
      - name: Save the report
        run: |
          cp config.yaml docs/config.yaml
          printf '{"owner":"%s","repo":"%s"}\n' "$GITHUB_REPOSITORY_OWNER" "${GITHUB_REPOSITORY#*/}" > docs/.repo-owner.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          shopt -s nullglob
          for path in archive/*/recommend archive/carryover.json; do
            if [ -e "$path" ]; then git add "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Publish GUI agents daily paper'
            git push
          fi
      - name: Package website
        run: |
          mkdir _site
          git archive HEAD index.html app docs .nojekyll | tar -x -C _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  publish:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
